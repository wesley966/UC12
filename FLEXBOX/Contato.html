<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Contato</title>
    <link rel="stylesheet" href="Index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">

        <div class="apresentacao">
            <img src="me_de_imagens_da_hora_pra_fazer_logos_de_app.jpg" alt="Imagem daHora" class="img">
            <h1 class="titulo">Contato</h1>
        </div>

        <nav class="menu">
            <a class="nav-opcao" href="Index.html">HOME</a>
            <a class="nav-opcao" href="Contato.html">CONTATO</a>
            <a class="nav-opcao" href="Produto.html">PRODUTO</a>
            <a class="nav-opcao" href="Sobre.html">SOBRE</a>
        </nav>

    </header>

  <img src="shutterstock_2324950067-e1732211981765.jpg" alt="Imagem daHora" class="img-dd">

    <div class="container">
        <div class="conteudo">
            <h2 class="titulo2">Formulário de Contato</h2>

            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br>

                <label for="mensagem">Mensagem:</label>
                <textarea  style="width: 400px; height: 150px;" id="mensagem" name="mensagem" required></textarea>

                <br>
                
                <input type="submit" value="Enviar">

            </form>
            <br>
            <label for="origem">Como nos conheceu?</label>

            <select id="origem" name="origem" required>
                <option value="">Selecione uma opção</option>
                <option value="internet">Internet</option>
                <option value="amigos">Amigos</option>
                <option value="redes">Redes sociais</option>
            </select>
        </div>
    </div>


<div class="footer-cont">
<footer>
    <p>Todos os direitos reservados.</p>
</footer>
</div>

</body>

</html>
